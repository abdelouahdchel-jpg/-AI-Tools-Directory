name: Periodic Tool URL Health Check

on:
  schedule:
    # Runs weekly every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: tool-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Check Live Reachability of Directory Tools
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Execute URL Verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/verify_existing_tools.ts
